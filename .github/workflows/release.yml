name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    strategy:
      matrix:
        rid: [win-x64, linux-x64, osx-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: bin/publish.sh ${{ matrix.rid }}
      - run: cd dist/${{ matrix.rid }} && zip -r ../parity-${{ github.ref_name }}-${{ matrix.rid }}.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/parity-${{ github.ref_name }}-${{ matrix.rid }}.zip
